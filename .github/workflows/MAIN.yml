# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

# Runs every 6 hours, and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Needed so the job can push the images to the "output" branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Generates the snake in light and dark versions
      - uses: Platane/snk@v3
        with:
          github_user_name: Mayankvya
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publishes the images to the "output" branch, which the README links to.
      # This keeps the main branch from cluttering up.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
